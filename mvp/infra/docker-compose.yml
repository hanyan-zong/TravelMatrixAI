services:
  postgres:
    image: postgres:16
    container_name: travelmatrix-postgres
    environment:
      POSTGRES_USER: travelmatrix
      POSTGRES_PASSWORD: travelmatrix
      POSTGRES_DB: travelmatrix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7
    container_name: travelmatrix-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: travelmatrix-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: travelmatrix
      MINIO_ROOT_PASSWORD: travelmatrix123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
